<form class="ui-dialog form" [formGroup]="form" (ngSubmit)="save()">
  <h2 class="ui-dialog-title m-0">Gewicht bearbeiten</h2>

  <div class="field">
    <label class="ui-input-label" for="weight-edit-date">Datum</label>
    <input id="weight-edit-date" type="date" class="ui-input ui-input--lime" formControlName="entryDate" [max]="today"
           [attr.aria-invalid]="form.get('entryDate')?.invalid"
           [attr.aria-describedby]="form.get('entryDate')?.hasError('future') ? 'weight-edit-date-error' : null" />
    @if (form.get('entryDate')?.hasError('future')) {
      <p id="weight-edit-date-error" class="field-error">Datum darf nicht in der Zukunft liegen</p>
    }
  </div>

  <div class="field">
    <label class="ui-input-label" for="weight-edit-kg">Gewicht (kg)</label>
    <input id="weight-edit-kg" type="number" step="0.1" min="0" inputmode="decimal" class="ui-input ui-input--lime"
           formControlName="weightKg" />
  </div>

  <div class="ui-dialog-actions">
    <button type="button" class="ui-btn" mat-dialog-close>
      <mat-icon aria-hidden="true">close</mat-icon>
      <span>Abbrechen</span>
    </button>
    <button type="submit" class="ui-btn ui-btn--teal" [disabled]="form.invalid">
      <mat-icon aria-hidden="true">check</mat-icon>
      <span>Speichern</span>
    </button>
  </div>
</form>
