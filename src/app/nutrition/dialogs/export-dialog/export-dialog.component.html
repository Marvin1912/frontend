<form class="ui-dialog form" [formGroup]="form" (ngSubmit)="export()">
  <h2 class="ui-dialog-title m-0">PDF exportieren</h2>

  <div class="form-grid">
    <div class="field">
      <label class="ui-input-label" for="export-from">Von</label>
      <input id="export-from" type="date" class="ui-input ui-input--lime" formControlName="from" [max]="today"
             [attr.aria-invalid]="rangeError" />
    </div>
    <div class="field">
      <label class="ui-input-label" for="export-to">Bis</label>
      <input id="export-to" type="date" class="ui-input ui-input--lime" formControlName="to" [max]="today"
             [attr.aria-invalid]="rangeError" />
    </div>
  </div>

  @if (futureError) {
    <div class="ui-alert ui-alert--danger" role="alert">Daten dürfen nicht in der Zukunft liegen.</div>
  } @else if (rangeError) {
    <div class="ui-alert ui-alert--danger" role="alert">„Von" muss vor „Bis" liegen.</div>
  }

  <div class="ui-dialog-actions">
    <button type="button" class="ui-btn" mat-dialog-close [disabled]="exporting()">
      <mat-icon aria-hidden="true">close</mat-icon>
      <span>Abbrechen</span>
    </button>
    <button type="submit" class="ui-btn ui-btn--teal" [disabled]="form.invalid || exporting()">
      @if (exporting()) {
        <mat-spinner diameter="18" />
      } @else {
        <mat-icon aria-hidden="true">file_download</mat-icon>
      }
      <span>Exportieren</span>
    </button>
  </div>
</form>
