<div class="ui-dialog form">
  <h2 class="ui-dialog-title m-0">Vorlage loggen</h2>

  <div class="field">
    <label class="ui-input-label" for="picker-meal">Mahlzeit</label>
    <select id="picker-meal" class="ui-input ui-input--teal" [formControl]="mealType">
      @for (m of mealTypes; track m.value) {
        <option [ngValue]="m.value">{{ m.label }}</option>
      }
    </select>
  </div>

  @if (loading) {
    <div class="ui-empty" role="status">
      <mat-spinner diameter="28" />
      <p class="m-0">Vorlagen werden geladen…</p>
    </div>
  } @else if (loadFailed) {
    <div class="ui-alert ui-alert--danger" role="alert">Vorlagen konnten nicht geladen werden.</div>
  } @else if (templates.length === 0) {
    <div class="ui-empty" role="status">
      <p class="m-0">Noch keine Vorlagen vorhanden.</p>
    </div>
  } @else {
    <div class="template-list" role="group" aria-label="Vorlagen">
      @for (template of templates; track template.id) {
        <button type="button" class="template-option" [class.template-option--selected]="selected === template"
                [attr.aria-pressed]="selected === template" (click)="select(template)">
          <span class="template-option__name">{{ template.name }}</span>
          <span class="template-option__meta">
            {{ template.items.length }} {{ template.items.length === 1 ? 'Eintrag' : 'Einträge' }} ·
            {{ totalKcal(template) | number:'1.0-0':'de' }} kcal
          </span>
        </button>
      }
    </div>
  }

  <div class="ui-dialog-actions">
    <button type="button" class="ui-btn" mat-dialog-close>
      <mat-icon aria-hidden="true">close</mat-icon>
      <span>Abbrechen</span>
    </button>
    <button type="button" class="ui-btn ui-btn--teal" [disabled]="!canConfirm" (click)="confirm()">
      <mat-icon aria-hidden="true">check</mat-icon>
      <span>Loggen</span>
    </button>
  </div>
</div>
