<form class="ui-dialog form" [formGroup]="form" (ngSubmit)="save()">
  <h2 class="ui-dialog-title m-0">Eintrag bearbeiten</h2>
  <p class="m-0 entry-label">{{ label }}</p>

  <div class="field">
    <label class="ui-input-label" for="entry-edit-meal">Mahlzeit</label>
    <select id="entry-edit-meal" class="ui-input ui-input--lime" formControlName="mealType">
      @for (m of mealTypes; track m.value) {
        <option [ngValue]="m.value">{{ m.label }}</option>
      }
    </select>
  </div>

  @if (isAdHoc) {
    <div class="field">
      <label class="ui-input-label" for="entry-edit-description">Beschreibung</label>
      <input id="entry-edit-description" class="ui-input ui-input--lime" formControlName="description" />
    </div>

    <div class="form-grid">
      <div class="field">
        <label class="ui-input-label" for="entry-edit-kcal">kcal</label>
        <input id="entry-edit-kcal" type="number" step="1" min="0" inputmode="numeric" class="ui-input ui-input--lime"
               formControlName="kcal" />
      </div>
      <div class="field">
        <label class="ui-input-label" for="entry-edit-protein">Protein (g)</label>
        <input id="entry-edit-protein" type="number" step="0.1" min="0" inputmode="decimal" class="ui-input ui-input--lime"
               formControlName="proteinG" />
      </div>
      <div class="field">
        <label class="ui-input-label" for="entry-edit-carbs">Kohlenhydrate (g)</label>
        <input id="entry-edit-carbs" type="number" step="0.1" min="0" inputmode="decimal" class="ui-input ui-input--lime"
               formControlName="carbsG" />
      </div>
      <div class="field">
        <label class="ui-input-label" for="entry-edit-fat">Fett (g)</label>
        <input id="entry-edit-fat" type="number" step="0.1" min="0" inputmode="decimal" class="ui-input ui-input--lime"
               formControlName="fatG" />
      </div>
    </div>
  } @else {
    <div class="field">
      <label class="ui-input-label" for="entry-edit-qty">Menge</label>
      <div class="input-affix">
        <input id="entry-edit-qty" type="number" step="1" min="0" inputmode="numeric" class="ui-input ui-input--lime"
               formControlName="quantityG" />
        <span class="input-affix__suffix" aria-hidden="true">g</span>
      </div>
    </div>
  }

  <div class="ui-dialog-actions">
    <button type="button" class="ui-btn" mat-dialog-close>
      <mat-icon aria-hidden="true">close</mat-icon>
      <span>Abbrechen</span>
    </button>
    <button type="submit" class="ui-btn ui-btn--teal" [disabled]="form.invalid">
      <mat-icon aria-hidden="true">check</mat-icon>
      <span>Speichern</span>
    </button>
  </div>
</form>
