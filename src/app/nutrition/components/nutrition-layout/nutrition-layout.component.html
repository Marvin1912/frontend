<header class="ui-topbar ui-topbar--lime sticky top-0 z-10">
  <div class="ui-topbar-group">
    <button type="button" [routerLink]="homeLink()" class="ui-btn-home" aria-label="Go home">
      <mat-icon>home</mat-icon>
    </button>
    <button type="button" [matMenuTriggerFor]="menu" class="ui-btn-home" aria-label="Open menu">
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu" class="ui-menu-panel">
      <a mat-menu-item routerLink="/nutrition">Home</a>
      <a mat-menu-item routerLink="/nutrition/dashboard">Dashboard</a>
      <a mat-menu-item routerLink="/nutrition/day">Tagebuch</a>
      <a mat-menu-item routerLink="/nutrition/canteen">Kantine</a>
      <a mat-menu-item routerLink="/nutrition/weight">Gewicht</a>
      <a mat-menu-item routerLink="/nutrition/ratios">Verhältnis</a>
      <a mat-menu-item routerLink="/nutrition/foods">Lebensmittel</a>
      <a mat-menu-item routerLink="/nutrition/meals">Mahlzeiten</a>
      <a mat-menu-item routerLink="/nutrition/meal-plan">Essensplan</a>
      <a mat-menu-item routerLink="/nutrition/profile">Profil</a>
    </mat-menu>
    <span class="ui-topbar-icon" aria-hidden="true"><mat-icon inline>restaurant</mat-icon></span>
    <h1 class="ui-topbar-title">Nutrition</h1>
  </div>
  <div class="ui-topbar-group">
    <button type="button" class="ui-btn-icon" aria-label="PDF exportieren" (click)="openExportDialog()">
      <mat-icon>file_download</mat-icon>
    </button>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>
