<header class="ui-topbar ui-topbar--teal sticky top-0 z-10">
  <div class="ui-topbar-group">
    <button type="button" [routerLink]="homeLink" class="ui-btn-home" aria-label="Go home">
      <mat-icon>home</mat-icon>
    </button>
    <button type="button" [matMenuTriggerFor]="menu" class="ui-btn-home" aria-label="Open menu">
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu" class="ui-menu-panel">
      <button mat-menu-item routerLink="/it-news">
        <span>Articles</span>
      </button>
      <button mat-menu-item routerLink="/it-news/feeds">
        <span>Feed Config</span>
      </button>
      <button mat-menu-item routerLink="/">
        <span>Home</span>
      </button>
    </mat-menu>
    <span class="ui-topbar-icon" aria-hidden="true"><mat-icon inline>newspaper</mat-icon></span>
    <h1 class="ui-topbar-title">IT News</h1>
  </div>
</header>

<main class="content">
  <router-outlet></router-outlet>
</main>
