<div class="ui-dialog">
  <h2 id="feed-delete-title" class="ui-dialog-title">Delete Feed</h2>

  <p class="m-0">Do you really want to delete the feed <strong class="feed-name">{{ data.feed.name }}</strong>?</p>

  <div class="ui-dialog-actions">
    <button type="button" class="ui-btn ui-btn--rose" mat-dialog-close cdkFocusInitial>
      <mat-icon aria-hidden="true">close</mat-icon>
      Cancel
    </button>
    <button type="button" class="ui-btn ui-btn--teal" (click)="confirm()">
      <mat-icon aria-hidden="true">check_circle</mat-icon>
      Delete
    </button>
  </div>
</div>
