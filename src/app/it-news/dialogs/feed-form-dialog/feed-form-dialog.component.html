<form class="ui-dialog feed-form" [formGroup]="feedForm" (ngSubmit)="save()">
  <h2 id="feed-form-title" class="ui-dialog-title">{{ isEdit ? 'Edit Feed' : 'Add Feed' }}</h2>

  <div class="feed-form__fields">
    @for (field of fields; track field.name) {
      <div>
        <label class="ui-input-label" [for]="'feed-' + field.name">{{ field.label }}</label>
        <input [id]="'feed-' + field.name" class="ui-input ui-input--teal" [formControlName]="field.name"
               [type]="field.type" [placeholder]="field.placeholder" autocomplete="off"
               [attr.aria-invalid]="showError(field.name)"
               [attr.aria-describedby]="showError(field.name) ? 'feed-' + field.name + '-error' : null">
        @if (showError(field.name)) {
          <p [id]="'feed-' + field.name + '-error'" class="field-error">{{ field.label }} is required.</p>
        }
      </div>
    }

    <mat-slide-toggle formControlName="active" class="active-toggle">Active</mat-slide-toggle>
  </div>

  <div class="ui-dialog-actions">
    <button type="button" class="ui-btn ui-btn--rose" mat-dialog-close>Cancel</button>
    <button type="submit" class="ui-btn ui-btn--teal">
      {{ isEdit ? 'Update' : 'Create' }}
    </button>
  </div>
</form>
