@for (s of summaries(); track s.key) {
  <details class="ui-panel month" [class.ui-panel--green]="s.difference >= 0" [class.ui-panel--rose]="s.difference < 0">

    <summary class="ui-panel-head month__head">
      <h2 class="ui-panel-label month__label">
        <span class="ui-panel-dot"></span>{{ s.label }}
      </h2>
      <span class="month__stats">
        <span class="ui-badge ui-badge--amber">
          <span class="stat-key">Ausgaben</span>{{ s.expenses | number: '1.2-2' : 'de' }}
        </span>
        <span class="ui-badge ui-badge--green">
          <span class="stat-key">Einnahmen</span>{{ s.income | number: '1.2-2' : 'de' }}
        </span>
        <span class="ui-badge" [class.ui-badge--blue]="s.difference >= 0" [class.ui-badge--rose]="s.difference < 0">
          <span class="stat-key">Differenz</span>{{ s.difference | number: '1.2-2' : 'de' }}
        </span>
      </span>
      <mat-icon class="month__chevron" aria-hidden="true">expand_more</mat-icon>
    </summary>

    <div class="month__body">
      <app-table title="Generelle Buchungen" category="usualBookings" [bookings]="s.month.usualBookings"
                 (itemRemoved)="onItemRemoved($event, s.month)"></app-table>
      <div class="month__col">
        <app-table title="Täglicher Bedarf" category="dailyCosts" [bookings]="s.month.dailyCosts"
                   (itemRemoved)="onItemRemoved($event, s.month)"></app-table>
        <app-table title="Einkommen" category="incomes" [bookings]="s.month.incomes"
                   (itemRemoved)="onItemRemoved($event, s.month)"></app-table>
      </div>
    </div>

  </details>
}
