<div class="detail" [class.detail--expanded]="expanded">

  <button type="button" class="detail__handle" aria-label="Ansicht vergrößern/verkleinern" (click)="toggleExpanded()">
    <span class="detail__handle-bar"></span>
  </button>

  <header class="detail__head">
    <h1 class="detail__title">{{ data.displayName }}</h1>
    <button mat-icon-button aria-label="Schließen" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="detail__body">
    @if (loading) {
      <div class="state">
        <mat-spinner diameter="32" />
      </div>
    } @else if (hasHistory) {
      <div class="chart">
        <canvas baseChart type="line" [data]="chartData" [options]="chartOptions"></canvas>
      </div>

      <div class="legend">
        @for (row of latestBySupermarket; track row.supermarket) {
          <span class="legend__item">
            <span class="legend__dot" [style.background]="colorFor(row.supermarket)"></span>
            {{ row.supermarket }}
            <span class="grocery-amount legend__price">
              {{ row.price | currency:'EUR':'symbol':'1.2-2':'de' }}
            </span>
          </span>
        }
      </div>
    } @else {
      <p class="grocery-text-muted empty">Für dieses Produkt liegt noch kein Preisverlauf vor.</p>
    }
  </div>

</div>
