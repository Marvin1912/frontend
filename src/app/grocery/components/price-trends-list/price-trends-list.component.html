<div class="price-trends">
  <header class="list-header">
    <span class="list-header__label">Preisverlauf</span>
  </header>

  @if (loading) {
    <div class="state">
      <mat-spinner diameter="32" />
    </div>
  } @else if (hasProducts) {
    <div class="trend-cards">
      @for (product of products; track product.groupId) {
        <button type="button" class="grocery-card trend-card" (click)="openDetail(product)">
          <div class="trend-card__info">
            <span class="trend-card__name">{{ product.groupName }}</span>
            <span class="grocery-amount trend-card__price">
              {{ product.latestPrice | currency:'EUR':'symbol':'1.2-2':'de' }}
            </span>
          </div>

          @if (product.sparklinePrices.length > 1) {
            <div class="trend-card__sparkline">
              <canvas baseChart type="line" [data]="product.sparklineData" [options]="sparklineOptions"></canvas>
            </div>
          }

          <span class="grocery-badge trend-card__badge" [class.grocery-badge--up]="product.up" [class.grocery-badge--down]="!product.up">
            {{ product.up ? '▲' : '▼' }} {{ product.displayPercent | number:'1.1-1':'de' }}%
          </span>
        </button>
      }
    </div>
  } @else {
    <div class="empty">
      <p class="grocery-text-muted empty__text">
        Noch keine Artikel-Gruppen mit Preisdaten. Artikel ohne Gruppenzuordnung werden hier ausgeblendet.
      </p>
      <a class="empty__link" routerLink="/grocery/articles">Artikel-Gruppen verwalten →</a>
    </div>
  }
</div>
