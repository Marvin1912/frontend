<div class="categories">
  <header class="table-header">
    <span class="table-header__dot"></span>
    <span class="table-header__label">KATEGORIEN</span>
  </header>

  @if (loading()) {
    <div class="state">
      <mat-spinner diameter="32" />
    </div>
  } @else if (categories().length > 0) {
    <div class="table-container">
      <table mat-table [dataSource]="categories()">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="col-header">Kategorie</th>
          <td mat-cell *matCellDef="let category">{{ category.name }}</td>
        </ng-container>

        <ng-container matColumnDef="articleCount">
          <th mat-header-cell *matHeaderCellDef class="col-header">Artikel</th>
          <td mat-cell *matCellDef="let category">{{ category.articleCount }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="col-header"></th>
          <td mat-cell *matCellDef="let category" class="col-actions">
            <button mat-icon-button (click)="openDeleteDialog(category)" class="action-btn" aria-label="Kategorie löschen">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  } @else {
    <p class="empty">Keine Kategorien gefunden.</p>
  }
</div>
