<div class="grocery-layout">
  <header class="topbar">
    <button mat-icon-button class="topbar__home" [routerLink]="homeLink" aria-label="Zurück zur App">
      <mat-icon>home</mat-icon>
    </button>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <nav class="bottom-nav" aria-label="Grocery Navigation">
    <a class="bottom-nav__item" routerLink="/grocery" routerLinkActive="is-active"
       [routerLinkActiveOptions]="{exact: true}">
      <mat-icon>home</mat-icon>
      <span>Home</span>
    </a>

    <a class="bottom-nav__item" routerLink="/grocery/receipts" routerLinkActive="is-active">
      <mat-icon>receipt_long</mat-icon>
      <span>Bons</span>
    </a>

    <div class="bottom-nav__fab-slot">
      <button mat-fab class="bottom-nav__fab" routerLink="/grocery/upload" aria-label="Bon scannen">
        <mat-icon>photo_camera</mat-icon>
      </button>
    </div>

    <a class="bottom-nav__item" routerLink="/grocery/price-trends" routerLinkActive="is-active">
      <mat-icon>trending_up</mat-icon>
      <span>Preise</span>
    </a>

    <a class="bottom-nav__item" routerLink="/grocery/more" routerLinkActive="is-active">
      <mat-icon>more_horiz</mat-icon>
      <span>Mehr</span>
    </a>
  </nav>
</div>
