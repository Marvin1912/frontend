<form class="ui-dialog form" [formGroup]="form" (ngSubmit)="save()">
  <h2 class="ui-dialog-title m-0">Supermarkt auswählen</h2>

  <div class="field">
    <label class="ui-input-label" for="supermarket">Supermarkt</label>
    <select id="supermarket" class="ui-input ui-input--orange" formControlName="supermarket">
      @for (market of supermarkets; track market.value) {
        <option [ngValue]="market.value">{{ market.label }}</option>
      }
    </select>
  </div>

  <div class="ui-dialog-actions">
    <button type="button" class="ui-btn" mat-dialog-close>
      <mat-icon aria-hidden="true">close</mat-icon>
      <span>Abbrechen</span>
    </button>
    <button type="submit" class="ui-btn ui-btn--teal" [disabled]="form.invalid">
      <mat-icon aria-hidden="true">check</mat-icon>
      <span>Übernehmen</span>
    </button>
  </div>
</form>
