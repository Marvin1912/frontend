<form class="ui-dialog form" [formGroup]="form" (ngSubmit)="save()">
  <h2 class="ui-dialog-title m-0">Artikel bearbeiten</h2>

  <div class="field">
    <label class="ui-input-label" for="edit-item-name">Artikel</label>
    <input id="edit-item-name" class="ui-input ui-input--orange" formControlName="name" autocomplete="off"
           [attr.aria-invalid]="isInvalid('name')"
           [attr.aria-describedby]="isInvalid('name') ? 'edit-item-name-error' : null" />
    @if (isInvalid('name')) {
      <p id="edit-item-name-error" class="field-error">Name ist erforderlich</p>
    }
  </div>

  <div class="form-grid">
    <div class="field">
      <label class="ui-input-label" for="edit-item-quantity">Menge</label>
      <input id="edit-item-quantity" type="number" inputmode="decimal" step="any" min="0" class="ui-input ui-input--orange"
             formControlName="quantity"
             [attr.aria-invalid]="isInvalid('quantity')"
             [attr.aria-describedby]="isInvalid('quantity') ? 'edit-item-quantity-error' : null" />
      @if (isInvalid('quantity')) {
        <p id="edit-item-quantity-error" class="field-error">Muss 0 oder größer sein</p>
      }
    </div>

    <div class="field">
      <label class="ui-input-label" for="edit-item-price">Einzelpreis (€)</label>
      <input id="edit-item-price" type="number" inputmode="decimal" step="0.01" min="0" class="ui-input ui-input--orange"
             formControlName="singlePrice"
             [attr.aria-invalid]="isInvalid('singlePrice')"
             [attr.aria-describedby]="isInvalid('singlePrice') ? 'edit-item-price-error' : null" />
      @if (isInvalid('singlePrice')) {
        <p id="edit-item-price-error" class="field-error">Muss 0 oder größer sein</p>
      }
    </div>
  </div>

  <div class="price-row" aria-live="polite">
    <span class="price-row__label">Gesamtpreis</span>
    <span class="price-row__value">{{ calculatedPrice | currency:'EUR':'symbol':'1.2-2':'de' }}</span>
  </div>

  <div class="ui-dialog-actions">
    <button type="button" class="ui-btn" mat-dialog-close>
      <mat-icon aria-hidden="true">close</mat-icon>
      <span>Abbrechen</span>
    </button>
    <button type="submit" class="ui-btn ui-btn--teal" [disabled]="form.invalid">
      <mat-icon aria-hidden="true">check</mat-icon>
      <span>Speichern</span>
    </button>
  </div>
</form>
