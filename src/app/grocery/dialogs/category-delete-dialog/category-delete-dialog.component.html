<h2 mat-dialog-title>Kategorie löschen</h2>

<mat-dialog-content>
  <span>Kategorie <strong>{{ data.name }}</strong> wirklich löschen?</span>
</mat-dialog-content>

<mat-dialog-actions align="center">
  <button mat-mini-fab color="warn" (click)="confirm()" aria-label="Löschen bestätigen">
    <mat-icon>check_circle</mat-icon>
  </button>
  <button mat-mini-fab mat-dialog-close aria-label="Abbrechen">
    <mat-icon>close</mat-icon>
  </button>
</mat-dialog-actions>
