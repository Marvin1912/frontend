<form class="ui-dialog form" (ngSubmit)="confirm()">
  <h2 class="ui-dialog-title m-0">Kategorie umbenennen</h2>

  <div class="field">
    <label class="ui-input-label" for="category-name">Name</label>
    <input id="category-name" class="ui-input ui-input--amber" name="name" autocomplete="off" required
           [(ngModel)]="name" cdkFocusInitial />
  </div>

  <div class="ui-dialog-actions">
    <button type="button" class="ui-btn" mat-dialog-close>
      <mat-icon aria-hidden="true">close</mat-icon>
      <span>Abbrechen</span>
    </button>
    <button type="submit" class="ui-btn ui-btn--teal" [disabled]="!isValid">
      <mat-icon aria-hidden="true">check</mat-icon>
      <span>Speichern</span>
    </button>
  </div>
</form>
