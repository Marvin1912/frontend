<h2 mat-dialog-title>Kategorie umbenennen</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="name-field">
    <mat-label>Name</mat-label>
    <input matInput
           [(ngModel)]="name"
           name="name"
           autocomplete="off"
           cdkFocusInitial
           (keydown.enter)="confirm()" />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="center">
  <button mat-mini-fab color="primary" [disabled]="!isValid" (click)="confirm()" aria-label="Bestätigen">
    <mat-icon>check_circle</mat-icon>
  </button>
  <button mat-mini-fab mat-dialog-close aria-label="Abbrechen">
    <mat-icon>close</mat-icon>
  </button>
</mat-dialog-actions>
