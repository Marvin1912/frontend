<div class="ui-dialog">
  <h2 class="ui-dialog-title">LLM-Matching starten?</h2>
  <p class="m-0">
    Dieser Lauf ruft die Claude-API auf (kostenpflichtig). Die Treffer landen als
    <strong>Vorschläge</strong> in der Liste und müssen dort angenommen oder verworfen werden.
    Verworfene Zuordnungen werden nicht erneut vorgeschlagen.
  </p>

  <div class="ui-dialog-actions">
    <button type="button" class="ui-btn" mat-dialog-close>
      <mat-icon aria-hidden="true">close</mat-icon>
      <span>Abbrechen</span>
    </button>
    <button type="button" class="ui-btn ui-btn--violet" (click)="confirm()">
      <mat-icon aria-hidden="true">psychology</mat-icon>
      <span>Starten</span>
    </button>
  </div>
</div>
