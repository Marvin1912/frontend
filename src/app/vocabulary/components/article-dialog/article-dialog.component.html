<div class="ui-dialog">
  <h2 id="article-dialog-title" class="ui-dialog-title">Select an article</h2>

  <div class="ui-dialog-actions">
    @for (article of articles; track article) {
      <button type="button" class="ui-btn ui-btn--amber min-w-16" [mat-dialog-close]="article">{{ article }}</button>
    }
  </div>
</div>
