<div class="ui-dialog">
  <h2 id="deck-change-name-title" class="ui-dialog-title">Rename Deck</h2>

  <label class="ui-input-label" for="deck-name">New name of deck</label>
  <input id="deck-name" class="ui-input ui-input--amber" [(ngModel)]="deckname" name="deckname" autocomplete="off">

  <div class="ui-dialog-actions">
    <button type="button" class="ui-btn ui-btn--rose" mat-dialog-close>Cancel</button>
    <button type="button" class="ui-btn ui-btn--teal" [mat-dialog-close]="deckname()">Ok</button>
  </div>
</div>
