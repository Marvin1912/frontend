<form class="ui-dialog" (ngSubmit)="onSubmit()">
  <h2 class="ui-dialog-title">Upload an image</h2>

  <label class="ui-input-label" for="plant-image-upload">Image for {{ plant.name }}</label>
  <input id="plant-image-upload" type="file" accept="image/*" class="ui-input ui-input--blue file-input"
         (change)="onFileSelected($event)" required/>

  @if (error()) {
    <div class="ui-alert ui-alert--danger dialog-alert" role="alert">{{ error() }}</div>
  }

  <div class="ui-dialog-actions">
    <button type="button" class="ui-btn ui-btn--rose" [disabled]="uploading()" (click)="dialogRef.close()">Cancel</button>
    <button type="submit" class="ui-btn ui-btn--teal" [disabled]="!selectedFile() || uploading()">Upload</button>
  </div>
</form>
