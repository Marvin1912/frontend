<div class="ui-dialog">
  <h2 class="ui-dialog-title">Delete plant {{ data.plant.name }}?</h2>
  <p class="m-0">The plant {{ data.plant.name }} will be removed permanently.</p>

  @if (error()) {
    <div class="ui-alert ui-alert--danger dialog-alert" role="alert">{{ error() }}</div>
  }

  <div class="ui-dialog-actions">
    <button type="button" class="ui-btn" [disabled]="deleting()" mat-dialog-close>
      <mat-icon aria-hidden="true">close</mat-icon>
      <span>Cancel</span>
    </button>
    <button type="button" class="ui-btn ui-btn--rose" [disabled]="deleting()" (click)="deletePlant()">
      <mat-icon aria-hidden="true">delete</mat-icon>
      <span>Delete</span>
    </button>
  </div>
</div>
