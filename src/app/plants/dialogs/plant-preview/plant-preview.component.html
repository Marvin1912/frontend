@if (plant) {
  <div class="ui-panel ui-panel--green plant-box">
    <div class="ui-panel-head">
      <span class="preview-name">{{ plant.name }}</span>
    </div>
    <div class="ui-panel-body preview-body">
      <dl class="preview-meta">
        <div class="meta-item">
          <dt class="meta-label">Location</dt>
          <dd class="meta-text">
            <mat-icon class="meta-icon" aria-hidden="true">{{ getIcon(plant) }}</mat-icon>
            {{ plant.location }}
          </dd>
        </div>
        <div class="meta-item">
          <dt class="meta-label">Species</dt>
          <dd class="meta-text">{{ plant.species }}</dd>
        </div>
      </dl>
      @if (imageUrl) {
        <img [src]="imageUrl" [alt]="plant.name" class="plant-img"/>
      }
    </div>
  </div>
}
