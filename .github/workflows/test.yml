name: Test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ui-styles is a private Git dependency; UI_STYLES_TOKEN = PAT with read access to Marvin1912/ui-styles
      - name: Allow access to private ui-styles repo
        run: git config --global url."https://x-access-token:${{ secrets.UI_STYLES_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"

      - run: npm ci

      - run: npm run test:ci

      - run: npm run build
